# PR check: runs the same fast checks as the deploy (tests, perf budgets,
# build, first-load budget) on every pull request, so a broken change shows
# red before it's merged. It never deploys. The slow believability seasons
# stay on main only (deploy.yml), since they take many minutes.
name: PR check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true   # a new push to the PR replaces the old run

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: packages may not run their own scripts on install.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:perf
      - run: npm run build
      - run: npm run check:first-load
