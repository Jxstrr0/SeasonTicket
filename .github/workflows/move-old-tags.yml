name: Move old tags (temporary)
# Temporary, run by hand once, then removed. Some release tags still point
# at an older copy of the history that main replaced. This moves each such
# tag onto the commit on main that has exactly the same files, so the
# release keeps its name and notes and nothing players see changes.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Move tags onto their twins on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          git clone --quiet --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" r
          cd r
          moved=0; left=0
          for t in $(git tag); do
            c=$(git rev-parse "$t^{commit}")
            if git merge-base --is-ancestor "$c" origin/main; then continue; fi
            tree=$(git rev-parse "$c^{tree}")
            m=$(git log origin/main --format='%H %T' | awk -v t="$tree" '$2==t{print $1; exit}')
            if [ -z "$m" ]; then echo "No twin on main for $t, left alone"; left=$((left+1)); continue; fi
            git tag -f "$t" "$m" >/dev/null
            git push --quiet --force origin "refs/tags/$t"
            echo "Moved $t"
            moved=$((moved+1))
          done
          echo "Moved $moved tags, left $left"
