# Dependabot: one grouped pull request a month for minor and patch npm updates,
# and one for the GitHub Actions the workflows use.
# npm major versions and three.js are skipped: those get done by hand.
# Security alerts are separate and still arrive for everything.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Wait a week after a release before proposing it (GitHub's own default is 3 days): a package
    # published by mistake, or by someone who took over an account, is usually pulled within days.
    # Security fixes don't wait; they still arrive at once.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "three"
      - dependency-name: "@types/three"

  # GitHub Actions (26 November 2026): one grouped pull request a month for the actions the
  # workflows use, major versions included, so the pinned actions don't go stale and a fixed
  # hole reaches us. Each action stays pinned to a full commit hash. The studio's security
  # scan flags a new pin until it has been checked against the action's own release.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # The same one-week wait as above.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
